[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganomaly"
version = "1.0.0"
description = "Unsupervised anomaly detection on auth, web and Windows logs: a light model and a neural one, compared on the same data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  "scipy>=1.11",
  "scikit-learn>=1.5",  # only to check the Isolation Forest against the reference one
]
notebook = ["matplotlib>=3.8", "ipykernel>=6"]

[project.scripts]
loganomaly = "loganomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["loganomaly"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/loganomaly/synth.py" = ["E501"]  # sample log lines and user-agent strings
